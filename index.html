<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Company Website - Preview</title>
  <style>
    :root { --bg: #f7f7f5; --text: #1a1a1a; --muted: #666; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #141414; --text: #f0f0f0; --muted: #999; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 16px; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    h1 { font-size: clamp(1.75rem, 5vw, 2.75rem); margin: 0 0 .5rem; }
    p { color: var(--muted); margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1>New website in progress</h1>
    <p>This is the test preview. The redesigned site will appear here.</p>
  </main>
</body>
</html>
